# Copy to /etc/nginx/sites-available/agency-website on the VPS, adjust
# the domain and the /uploads/ alias path, then:
#   ln -s /etc/nginx/sites-available/agency-website /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# One app serves every host: hephastusdev.com (redirects visitors to their
# region), eu. and bd. (the public sites) and admin. (the admin panel). The
# app tells them apart by Host, so every subdomain must reach this block.
#
# TLS: the subdomains need a wildcard certificate, which Let's Encrypt only
# issues via a DNS challenge. With DNS on Cloudflare:
#   apt install python3-certbot-dns-cloudflare
#   certbot certonly --dns-cloudflare --dns-cloudflare-credentials ~/.cf.ini \
#     -d hephastusdev.com -d '*.hephastusdev.com'
#   certbot install --nginx --cert-name hephastusdev.com
# (or run the whole site through Cloudflare's proxy and use an Origin
# Certificate — see DEPLOY.md).

upstream agency_website {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    listen [::]:80;
    server_name hephastusdev.com *.hephastusdev.com;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Serve uploaded files directly from disk, bypassing Node entirely.
    # This path must point at the project's `uploads/` directory and must
    # be a stable location that survives redeploys -- see DEPLOY.md.
    location /uploads/ {
        alias /var/www/agency-website/uploads/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://agency_website;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Overwrite, never pass through: the app routes on this header, so a
        # client-supplied value must not reach it.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
